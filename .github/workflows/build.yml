name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: lake build + gate de pureza
    runs-on: ubuntu-latest

    steps:
      # El lakefile declara las dependencias como rutas LOCALES `../X` (ADR-011),
      # así que el proyecto se saca a un subdirectorio y las tres hermanas se
      # clonan a su lado. Sin esto, `lake build` no encuentra nada.
      - name: Checkout PeanoRF
        uses: actions/checkout@v4
        with:
          path: PeanoRF
          # 🚨 `fetch-depth: 0` NO es opcional: el control [D] de check-doc-sync
          # compara la marca de tiempo de cada documento con `git log -1 -- <fichero>`,
          # y en un checkout SHALLOW (el de por defecto, profundidad 1) git atribuye
          # CUALQUIER fichero a HEAD. El 2026-09-19 eso puso la CI en rojo con
          # `DEPENDENCIES.md`, que el commit ni siquiera tocaba. El script lleva además
          # su propia guarda `is-shallow-repository`, que se pone ROJA si esto falta:
          # las dos cosas, porque una sola se puede deshacer sin que nadie lo note.
          fetch-depth: 0

      - name: Checkout FOL
        uses: actions/checkout@v4
        with:
          repository: julian1c2a/FOL
          ref: master
          path: FOL

      # master, NO las ramas de trabajo: ROBINSON_PlusPlus desarrolla con el árbol
      # en rojo de forma conocida y localizada, y eso no debe romper este build.
      - name: Checkout ROBINSON_PlusPlus
        uses: actions/checkout@v4
        with:
          repository: julian1c2a/ROBINSON_PlusPlus
          ref: master
          path: ROBINSON_PlusPlus

      - name: Checkout Peano
        uses: actions/checkout@v4
        with:
          repository: julian1c2a/Peano
          ref: master
          path: Peano

      # ⭐ EL CUARTETO CERTIFICADO (ADR-043). Las tres hermanas se clonan en `ref: master`,
      # que es FLOTANTE: sin esto, un verde no dice contra QUÉ lo fue, y un rojo nuevo no se
      # puede atribuir. Medido el 2026-09-22: FOL y RPP se movieron los dos el mismo día, y
      # FOL generificó `Model` a `ModelG` —justo el tipo que `HA/Model.lean` usa—, sin que la
      # CI dejara rastro de qué builds cubrían ese cambio y cuáles no.
      #
      # ⚠️ Esto REGISTRA, no FIJA. Fijar los SHA es otra decisión y tiene su precio: dejas de
      # enterarte de que aguas arriba te rompió hasta el día que subes el pin. Aguas arriba
      # hace lo mismo que aquí: FOL certifica el par (FOL@sha, RPP@sha) desde su ADR-073.
      #
      # `if: always()`: el certificado hace MÁS falta cuando el build sale rojo.
      - name: Certificar el cuarteto (PeanoRF, FOL, RPP, Peano)
        if: always()
        run: |
          fila () {
            if [ -d "$2/.git" ]; then
              printf '| %s | `%s` | %s |\n' "$1" \
                "$(git -C "$2" rev-parse HEAD)" \
                "$(git -C "$2" log -1 --format=%s | cut -c1-60)"
            else
              printf '| %s | ⛔ NO CLONADO | — |\n' "$1"
            fi
          }
          {
            echo "### Cuarteto certificado"
            echo ""
            echo "| repo | sha | último commit |"
            echo "|---|---|---|"
            fila "PeanoRF"           PeanoRF
            fila "FOL"               FOL
            fila "ROBINSON_PlusPlus" ROBINSON_PlusPlus
            fila "Peano"             Peano
          } >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      - name: Install elan (Lean version manager)
        timeout-minutes: 5
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --no-modify-path
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      # ⚠️ Escalar de bloque (`run: |`) a propósito: en una sola línea, el `-d:` de
      # `cut` lleva dos puntos seguidos de espacio y YAML lo lee como un mapa
      # («mapping values are not allowed here»). Ése era el fallo original.
      #
      # 🚨 CON REINTENTO Y CON RELOJ (ADR-043). El 2026-09-22 este paso se quedó **20
      # minutos** colgado descargando el toolchain y murió con «error during download /
      # Recv failure: Connection reset by peer». La CI salió ROJA sin que el código ni
      # aguas arriba tuvieran nada que ver, y el relanzamiento pasó en 1m41s.
      #
      # ⛔ Lo que eso enseña no es que hubiera una caída de red —eso pasa—, sino que **la CI
      # no distinguía «el código está mal» de «el entorno falló»**, y sin reloj una caída
      # se come el runner entero. `timeout 300` por intento mata el cuelgue, tres intentos
      # con espera creciente absorben lo transitorio, y `timeout-minutes` es el tope duro
      # por si el bucle mismo se atasca.
      - name: Install Lean toolchain
        timeout-minutes: 20
        run: |
          # ⚠️ `tr -d '\r'` NO es decorativo: si `lean-toolchain` llega con CRLF —le pasó
          # a AczelSetTheory, cuyo blob lo tenía— `cut` devuelve «v4.31.0\r» y elan
          # contesta «invalid toolchain name». Medido: su CI murió en 11 s por ese byte.
          TOOLCHAIN=$(cut -d: -f2 PeanoRF/lean-toolchain | tr -d '\r')
          echo "toolchain pedido: $TOOLCHAIN"
          for intento in 1 2 3; do
            if timeout 300 elan toolchain install "$TOOLCHAIN"; then
              echo "✅ toolchain instalado en el intento $intento"
              exit 0
            fi
            if [ "$intento" -lt 3 ]; then
              echo "::warning::intento $intento de 3: falló la instalación de $TOOLCHAIN (red o cuelgue). Reintento."
              sleep $((intento * 20))
            fi
          done
          echo "::error::no se pudo instalar el toolchain $TOOLCHAIN tras 3 intentos."
          echo "    Si el log dice «error during download» o «Connection reset by peer»,"
          echo "    esto es el ENTORNO y no el proyecto: relanzar el job."
          exit 1

      - name: Cache Lake builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            FOL/.lake/build
            ROBINSON_PlusPlus/.lake/build
            Peano/.lake/build
            PeanoRF/.lake
          key: ${{ runner.os }}-lake-${{ hashFiles('PeanoRF/lean-toolchain', 'PeanoRF/lakefile.lean') }}
          restore-keys: |
            ${{ runner.os }}-lake-

      # Incluye el gate de los tres ejes (`PeanoRF/Meta/AxiomCheck.lean`), que corre
      # como parte de la compilación: si alguien introduce lógica clásica de nivel
      # objeto, una ω-regla fuera de la capa declarada o un `Classical` propio, esto
      # se pone en rojo.
      - name: Build
        working-directory: PeanoRF
        run: lake build

      # Bloqueante: la línea base del proyecto es 0 sorry.
      - name: Check for sorry
        working-directory: PeanoRF
        run: bash check-sorry.bash

      # ⛔ SIN `--quick`, y es deliberado. Con `--quick` el script se salta DOS controles
      # y lo dice — pero decirlo no es comprobarlo: `[A] jobs` y sobre todo **`[E] alcance
      # del gate`** quedaban sin red en remoto. Y `[E]` es justo el que caza que el gate se
      # haya quedado ciego, que es lo que pasó el 2026-09-21 cuando FOL generizó su
      # sintaxis y `Derives₀` desapareció del inventario sin que nadie se enterara.
      #
      # ✅ Medido antes de quitarlo: el segundo `lake build` sale del caché y Lean
      # **reproduce los `logInfo`**, así que el gate publica su alcance igual y `[E]` mide.
      # No cuesta tiempo y cierra el agujero.
      - name: Doc sync
        working-directory: PeanoRF
        run: bash check-doc-sync.bash

name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: lake build + gate de pureza
    runs-on: ubuntu-latest

    steps:
      # El lakefile declara las dependencias como rutas LOCALES `../X` (ADR-011),
      # así que el proyecto se saca a un subdirectorio y las tres hermanas se
      # clonan a su lado. Sin esto, `lake build` no encuentra nada.
      - name: Checkout PeanoRF
        uses: actions/checkout@v4
        with:
          path: PeanoRF
          # 🚨 `fetch-depth: 0` NO es opcional: el control [D] de check-doc-sync
          # compara la marca de tiempo de cada documento con `git log -1 -- <fichero>`,
          # y en un checkout SHALLOW (el de por defecto, profundidad 1) git atribuye
          # CUALQUIER fichero a HEAD. El 2026-09-19 eso puso la CI en rojo con
          # `DEPENDENCIES.md`, que el commit ni siquiera tocaba. El script lleva además
          # su propia guarda `is-shallow-repository`, que se pone ROJA si esto falta:
          # las dos cosas, porque una sola se puede deshacer sin que nadie lo note.
          fetch-depth: 0

      - name: Checkout FOL
        uses: actions/checkout@v4
        with:
          repository: julian1c2a/FOL
          ref: master
          path: FOL

      # master, NO las ramas de trabajo: ROBINSON_PlusPlus desarrolla con el árbol
      # en rojo de forma conocida y localizada, y eso no debe romper este build.
      - name: Checkout ROBINSON_PlusPlus
        uses: actions/checkout@v4
        with:
          repository: julian1c2a/ROBINSON_PlusPlus
          ref: master
          path: ROBINSON_PlusPlus

      - name: Checkout Peano
        uses: actions/checkout@v4
        with:
          repository: julian1c2a/Peano
          ref: master
          path: Peano

      - name: Install elan (Lean version manager)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --no-modify-path
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      # ⚠️ Escalar de bloque (`run: |`) a propósito: en una sola línea, el `-d:` de
      # `cut` lleva dos puntos seguidos de espacio y YAML lo lee como un mapa
      # («mapping values are not allowed here»). Ése era el fallo original.
      - name: Install Lean toolchain
        run: |
          # ⚠️ `tr -d '\r'` NO es decorativo: si `lean-toolchain` llega con CRLF —le pasó
          # a AczelSetTheory, cuyo blob lo tenía— `cut` devuelve «v4.31.0\r» y elan
          # contesta «invalid toolchain name». Medido: su CI murió en 11 s por ese byte.
          elan toolchain install $(cut -d: -f2 PeanoRF/lean-toolchain | tr -d '\r')

      - name: Cache Lake builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            FOL/.lake/build
            ROBINSON_PlusPlus/.lake/build
            Peano/.lake/build
            PeanoRF/.lake
          key: ${{ runner.os }}-lake-${{ hashFiles('PeanoRF/lean-toolchain', 'PeanoRF/lakefile.lean') }}
          restore-keys: |
            ${{ runner.os }}-lake-

      # Incluye el gate de los tres ejes (`PeanoRF/Meta/AxiomCheck.lean`), que corre
      # como parte de la compilación: si alguien introduce lógica clásica de nivel
      # objeto, una ω-regla fuera de la capa declarada o un `Classical` propio, esto
      # se pone en rojo.
      - name: Build
        working-directory: PeanoRF
        run: lake build

      # Bloqueante: la línea base del proyecto es 0 sorry.
      - name: Check for sorry
        working-directory: PeanoRF
        run: bash check-sorry.bash

      # ⛔ SIN `--quick`, y es deliberado. Con `--quick` el script se salta DOS controles
      # y lo dice — pero decirlo no es comprobarlo: `[A] jobs` y sobre todo **`[E] alcance
      # del gate`** quedaban sin red en remoto. Y `[E]` es justo el que caza que el gate se
      # haya quedado ciego, que es lo que pasó el 2026-09-21 cuando FOL generizó su
      # sintaxis y `Derives₀` desapareció del inventario sin que nadie se enterara.
      #
      # ✅ Medido antes de quitarlo: el segundo `lake build` sale del caché y Lean
      # **reproduce los `logInfo`**, así que el gate publica su alcance igual y `[E]` mide.
      # No cuesta tiempo y cierra el agujero.
      - name: Doc sync
        working-directory: PeanoRF
        run: bash check-doc-sync.bash
